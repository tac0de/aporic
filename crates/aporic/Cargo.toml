[package]
name = "aporic"
version = "0.22.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/tac0de/aporic"
readme = "../../README.md"
description = "Local-first evidence and coordination kernel for AI-assisted engineering"

[[bin]]
name = "aporic"
path = "src/bin/aporic.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
directories = "6.0"
hmac = "0.12"
libc = "0.2"
rmcp = { version = "3.4.0", features = [
    "client",
    "schemars",
    "server",
    "transport-child-process",
    "transport-io",
] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.0", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "time"] }
uuid = { version = "1.0", features = ["v7"] }

[dev-dependencies]
tempfile = "3.0"
