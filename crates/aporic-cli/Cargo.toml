[package]
name = "aporic-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "aporicctl"
path = "src/main.rs"

[dependencies]
aporic-boundary = { path = "../aporic-boundary" }
aporic-handoff = { path = "../aporic-handoff" }
aporic-host = { path = "../aporic-host" }
aporic-kernel = { path = "../aporic-kernel" }
aporic-model-control = { path = "../aporic-model-control" }
aporic-projects = { path = "../aporic-projects" }
aporic-routing = { path = "../aporic-routing" }
aporic-roles = { path = "../aporic-roles" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
