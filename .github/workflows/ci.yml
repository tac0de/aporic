name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p aporic-structural-analyzer --target wasm32-unknown-unknown --release --locked
      - name: Validate JSON Schemas
        run: |
          python3 -m json.tool schemas/commit-request.schema.json >/dev/null
          python3 -m json.tool schemas/codex-session-start.schema.json >/dev/null
          python3 -m json.tool schemas/codex-user-prompt-submit.schema.json >/dev/null
          python3 -m json.tool schemas/codex-pre-tool-use.schema.json >/dev/null
          python3 -m json.tool schemas/codex-post-tool-use.schema.json >/dev/null
          python3 -m json.tool schemas/codex-session-end.schema.json >/dev/null
          python3 -m json.tool schemas/aporic-policy-v1.schema.json >/dev/null
          python3 -m json.tool schemas/aporic-projection-v2.schema.json >/dev/null
          python3 -m json.tool schemas/aporic-projection-v3.schema.json >/dev/null
          python3 -m json.tool schemas/aporic-projection-v4.schema.json >/dev/null
          python3 -m json.tool schemas/aporic-projection-v5.schema.json >/dev/null
          python3 -m json.tool schemas/aporic-analyzer-input-v1.schema.json >/dev/null
          python3 -m json.tool schemas/aporic-analyzer-output-v1.schema.json >/dev/null

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - run: cargo test --workspace --locked
