name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check advisories bans licenses sources

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked --version 0.9.0
      - run: cargo llvm-cov --workspace --locked --fail-under-lines 70

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Windows MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $locator = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $locator -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "MSVC x64 tools were not found" }
          $setup = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          $lines = & cmd.exe /d /c ('"{0}" -no_logo -arch=x64 -host_arch=x64 >nul && set' -f $setup)
          if ($LASTEXITCODE -ne 0) { throw "MSVC environment setup failed" }
          $names = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VSINSTALLDIR', 'VSCMD_ARG_TGT_ARCH', 'VCToolsVersion', 'WindowsSdkDir', 'WindowsSDKVersion')
          $values = @{}
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $names -contains $Matches[1]) {
              $values[$Matches[1].ToUpperInvariant()] = $Matches[2]
            }
          }
          foreach ($required in @('PATH', 'LIB', 'INCLUDE', 'VCINSTALLDIR')) {
            if (-not $values[$required]) { throw "Missing MSVC variable: $required" }
          }
          $linker = $values['PATH'].Split(';') | Where-Object { $_ } | ForEach-Object { Join-Path $_ 'link.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $linker -or -not $linker.StartsWith($values['VCINSTALLDIR'], [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "PATH resolves an unexpected linker: $linker"
          }
          Write-Output "Selected MSVC linker: $linker"
          foreach ($entry in $values.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - run: rustup show active-toolchain
      - run: cargo test --workspace --locked
