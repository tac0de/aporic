name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Validate JSON Schemas
        run: |
          python3 -m json.tool schemas/commit-request.schema.json >/dev/null
          python3 -m json.tool schemas/codex-session-start.schema.json >/dev/null
          python3 -m json.tool schemas/codex-pre-tool-use.schema.json >/dev/null
          python3 -m json.tool schemas/aporic-policy-v1.schema.json >/dev/null
          python3 -m json.tool schemas/aporic-projection-v2.schema.json >/dev/null
          python3 -m json.tool schemas/aporic-projection-v3.schema.json >/dev/null

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          rustup default 1.89.0
      - run: cargo test --locked
