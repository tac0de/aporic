[package]
name = "aporic"
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
description = "A local commitment-state kernel for coding agents"
repository = "https://github.com/tac0de/aporic"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["ai", "agents", "governance", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = { version = "40.0.4", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }

[workspace]
members = [
    "analyzers/structural",
    "crates/aporic-boundary",
    "crates/aporic-cli",
    "crates/aporic-handoff",
    "crates/aporic-host",
    "crates/aporic-kernel",
    "crates/aporic-model-control",
    "crates/aporic-observatory",
    "crates/aporic-projects",
    "crates/aporic-routing",
    "crates/aporic-roles",
]
